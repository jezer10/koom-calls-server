# Dev coturn configuration for local docker-compose.
# This file is provided as a reference of the production-style configuration.
# In `docker-compose.yml` we instead pass equivalent flags via `command:` so
# that environment variables (TURN_SHARED_SECRET, etc.) flow through
# automatically. The values below are sane defaults for local dev; do NOT use
# them outside the dev environment.

listening-port=3478
tls-listening-port=5349
realm=koom.local
server-name=koom.local

listening-ip=0.0.0.0

# Relay port range must match the published UDP range in docker-compose.yml.
min-port=49152
max-port=49252

# Fingerprint / SHA-256 for STUN/TURN.
fingerprint
sha256
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-loopback-peers
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Use a static secret (REST API style). The API will sign credentials with
# `static-auth-secret` and embed them in the TURN password.
# NOTE: keep the default below only for local dev. Override via the
# docker-compose `command:` override (--static-auth-secret=$TURN_SHARED_SECRET)
# so secrets do not end up in this file.
static-auth-secret=dev-turn-secret
use-auth-secret

# Default user/database (still required by coturn even with use-auth-secret).
user=koom:koom
