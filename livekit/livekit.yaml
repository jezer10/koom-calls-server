# LiveKit configuration template for local docker-compose.
# docker-compose currently launches LiveKit with `--dev` (which spins up
# an ephemeral in-memory config and registers a well-known devkey/secret
# pair, disabling the 32-char prod secret-length check). The same values
# are mirrored in back/.env as LIVEKIT_API_KEY / LIVEKIT_API_SECRET so the
# back signs JWTs that match the server's in-memory key set.
#
# For production, switch docker-compose to `--config /etc/livekit.yaml`,
# set a >=32-char LIVEKIT_API_SECRET in .env, and either inline the keys
# here or inject them via a `LIVEKIT_KEYS` env var (livekit-server reads
# that directly).

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7880
  use_external_ip: false

logging:
  level: info
  json: false

room:
  empty_timeout: 0
  max_participants: 50

turn:
  enabled: true
  udp_port: 7882
  domain: livekit

keys:
  devkey: secret
