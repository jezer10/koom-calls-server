# Dev LiveKit configuration for local docker-compose.
# API key/secret are read from environment variables and substituted at startup
# when this file is passed with `--config /etc/livekit.yaml`.
#
# NOTE: docker-compose currently launches LiveKit with the built-in `--dev`
# flag (which spins up an ephemeral in-memory config) so that the host
# `LIVEKIT_API_KEY` / `LIVEKIT_API_SECRET` from the compose `.env` are
# honoured without templating. The block below is the equivalent production-
# style config and is kept as a reference / for future `--config` mode.

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7880
  use_external_ip: false

logging:
  level: info
  json: false

api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}

room:
  empty_timeout: 0
  max_participants: 50

turn:
  enabled: true
  udp_port: 7882
  domain: livekit

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
