name: koom-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ['5433:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports: ['7880:7880', '7881:7881/udp', '7882:7882/udp']
    volumes: ['./livekit/livekit.yaml:/etc/livekit.yaml:ro']
    env_file: .env

  coturn:
    image: coturn/coturn:latest
    command: -n --log-file=stdout --realm=koom.local --static-auth-secret=${TURN_SHARED_SECRET} --use-auth-secret --listening-port=3478 --tls-listening-port=5349 --min-port=49152 --max-port=49252 --fingerprint --no-multicast-peers
    ports: ['3478:3478/udp', '3478:3478/tcp', '5349:5349/tcp', '49152-49252:49152-49252/udp']

  api:
    build: { context: ., dockerfile: Dockerfile }
    ports: ['8080:8080']
    environment: { NODE_ENV: production }
    env_file: .env
    depends_on: [postgres, redis, livekit]

volumes:
  postgres-data:
