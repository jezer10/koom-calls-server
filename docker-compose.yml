name: koom-server

# Stack Docker completo orientado a servidor simple.
# - `api` y `coturn` publican al host.
# - `api` y `livekit` también se conectan a `npm-proxy` para reverse proxy
#   cuando Nginx Proxy Manager corre en el mismo host.
# - El resto vive en la red `internal` del compose.
networks:
  internal:
    internal: true
  npm-proxy:
    external: true
    name: npm-proxy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koom}
      POSTGRES_DB: ${POSTGRES_DB:-koom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    networks:
      - internal

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - internal
      - npm-proxy

  coturn:
    image: coturn/coturn:latest
    command: >
      -n --log-file=stdout --realm=${TURN_REALM:-koom.local}
      --static-auth-secret=${TURN_SHARED_SECRET} --use-auth-secret
      --listening-port=3478 --tls-listening-port=5349
      --min-port=49152 --max-port=49252 --fingerprint
      --no-multicast-peers
    ports:
      - 3478:3478/udp
      - 3478:3478/tcp
      - 5349:5349/tcp
      - 49152-49252:49152-49252/udp
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-koom}:${POSTGRES_PASSWORD:-koom}@postgres:5432/${POSTGRES_DB:-koom}
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_HTTP_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    depends_on:
      - postgres
      - redis
      - livekit
    networks:
      - internal
      - npm-proxy

volumes:
  postgres-data:
