name: koom-dev

# Surface mínima: solo el `api` (8080) y `coturn` (rango UDP) publican al host.
# El resto vive en la red `internal` del compose, sin acceso a internet ni
# al host. Ver docs/CI-CD.md §3 para el detalle de firewall en prod.
networks:
  internal:
    internal: true   # sin gateway → los servicios no pueden salir a internet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]

  redis:
    image: redis:7-alpine
    networks: [internal]

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    volumes: ['./livekit/livekit.yaml:/etc/livekit.yaml:ro']
    env_file: .env
    # Plano de control 7880 queda en la red internal (solo `api` lo usa).
    # Plano de medios 7881/7882 UDP lo publica el workflow de prod o el
    # proxy reverso del VPS — ver docs/CI-CD.md §3.
    networks: [internal]

  coturn:
    image: coturn/coturn:latest
    command: -n --log-file=stdout --realm=koom.local --static-auth-secret=${TURN_SHARED_SECRET} --use-auth-secret --listening-port=3478 --tls-listening-port=5349 --min-port=49152 --max-port=49252 --fingerprint --no-multicast-peers
    # Único además del api que DEBE exponer puertos al host: los clientes
    # WebRTC (navegador) negocian contra TURN para atravesar NAT.
    ports: ['3478:3478/udp', '3478:3478/tcp', '5349:5349/tcp', '49152-49252:49152-49252/udp']
    networks: [internal]

  api:
    build: { context: ., dockerfile: Dockerfile }
    # Único entrypoint HTTP hacia el front.
    ports: ['8080:8080']
    environment: { NODE_ENV: production }
    env_file: .env
    depends_on: [postgres, redis, livekit]
    networks: [internal]

volumes:
  postgres-data:
