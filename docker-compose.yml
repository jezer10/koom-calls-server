name: koom-dev

# Local development stack for koom-calls-server.
# Brings up: api (NestJS), postgres, redis, livekit, coturn.
# The SPA (front/) is intentionally NOT included; run its dev server
# separately and point it at http://localhost:8080.

services:
  postgres:
    image: postgres:16-alpine
    container_name: koom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: koom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: koom-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881/udp"
      - "7882:7882/udp"
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: koom-coturn
    restart: unless-stopped
    command: >
      -n
      --log-file=stdout
      --realm=koom.local
      --static-auth-secret=${TURN_SHARED_SECRET}
      --use-auth-secret
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49152
      --max-port=49252
      --no-cli
      --no-tlsv1
      --no-tlsv1_1
      --fingerprint
      --sha256
      --no-multicast-peers
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koom-api
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SIGNALING_NAMESPACE: ${SIGNALING_NAMESPACE}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SKIP_PEER: ${SKIP_PEER:-0}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      TURN_URL: ${TURN_URL}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_TTL: ${TURN_TTL}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
    name: koom-postgres-data
