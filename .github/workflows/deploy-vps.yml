name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Publish Docker image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag a desplegar (default: latest). Ej: main-abc1234, v1.0.0'
        required: false
        default: 'latest'
      require_env:
        description: 'Fallar si .env no existe en la VPS. false solo para primer deploy.'
        required: false
        default: 'true'

# Evita que dos deploys peleen por el mismo contenedor.
concurrency:
  group: deploy-${{ github.event.repository.name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: production

    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.VPS_DEPLOY_DIR_BACK || '$HOME/koom-calls-server' }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"
            # workflow_dispatch puede forzar require_env=false (primer deploy).
            # workflow_run siempre lo requiere.
            REQUIRE_ENV='${{ github.event_name == ''workflow_dispatch'' && github.event.inputs.require_env || ''true'' }}'

            cd "$DEPLOY_DIR"

            if [ "$REQUIRE_ENV" = "true" ] && [ ! -f .env ]; then
              echo "::error::Falta $DEPLOY_DIR/.env en la VPS. Copiá back/.env.example.docker y editá, o re-ejecutá este workflow con require_env=false."
              exit 1
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f koom-calls-server || true
            docker network inspect koom-net >/dev/null 2>&1 || docker network create koom-net

            RUN_ARGS=(-d --name koom-calls-server --restart unless-stopped --network koom-net -p 8080:8080)
            if [ -f .env ]; then RUN_ARGS+=(--env-file .env); fi
            docker run "${RUN_ARGS[@]}" "$IMAGE"

            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
                echo "Backend healthy after ${i}s"
                break
              fi
              sleep 1
            done
            if ! curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "::error::Backend unhealthy after 20s"
              docker logs --tail 50 koom-calls-server || true
              exit 1
            fi

            echo "Deploy completed: $(docker inspect --format '{{.Image}}' koom-calls-server)"
