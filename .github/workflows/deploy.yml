name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a desplegar (default: latest). Ej: main-abc1234'
        required: false
        default: 'latest'

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          platforms: linux/amd64

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.VPS_DEPLOY_DIR_BACK || '$HOME/koom-calls-server' }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}"

            cd "$DEPLOY_DIR"
            [ -f .env ] || { echo "::error::Falta $DEPLOY_DIR/.env en la VPS. Copiá back/.env.example y editá los valores del servidor."; exit 1; }

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f koom-calls-server || true

            docker run -d \
              --name koom-calls-server \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file .env \
              "$IMAGE"

            for i in $(seq 1 20); do
              curl -fsS http://localhost:8080/health >/dev/null 2>&1 && { echo "Backend healthy after ${i}s"; exit 0; }
              sleep 1
            done
            echo "::error::Backend unhealthy after 20s"
            docker logs --tail 50 koom-calls-server || true
            exit 1
